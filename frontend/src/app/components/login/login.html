<div class="login-container">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <div class="header-content">
        <img src="assets/company logo.png" alt="Sunplast Logo" class="company-logo">
        <mat-card-subtitle>Sign in to access the system</mat-card-subtitle>
      </div>
    </mat-card-header>
    
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="username" name="username" required autocomplete="username">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
        
        <mat-form-field appearance="outline" style="width: 100%; margin-top: 8px;">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required autocomplete="current-password">
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="loading || !loginForm.valid" class="login-button">
          @if (loading) {
            <mat-spinner diameter="20" style="margin-right: 8px;"></mat-spinner> Logging in...
          } @else {
            Login
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
